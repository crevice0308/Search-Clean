<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Clean Lite</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
    <script src="updater-popup.js" defer></script>
  </head>
  <body>
    <main aria-busy="true">
      <h1>Search Clean Lite</h1>
      <label class="setting" for="enabled">
        <span>AIによる概要を非表示</span>
        <span class="switch">
          <input id="enabled" type="checkbox" role="switch" aria-describedby="status" checked disabled>
          <span class="track" aria-hidden="true"></span>
        </span>
      </label>
      <p id="status" role="status" aria-live="polite">設定を読み込み中…</p>
      <section class="updater" aria-label="Updates">
        <label for="auto-update"><input id="auto-update" type="checkbox" disabled> <span id="update-label">自動更新（任意）</span></label>
        <p id="update-help"></p>
        <button id="update-now" type="button" disabled>今すぐ確認・更新</button>
        <p id="update-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
